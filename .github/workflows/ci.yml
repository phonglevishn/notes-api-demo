name: CI

on:
  push:
    branches: [main]
  pull_request:

# Một lượt mới của cùng nhánh hủy lượt cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Chỉ đọc mã. Không có bí mật nào trong workflow này.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NotesApi.slnx

      - name: Build
        run: dotnet build NotesApi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NotesApi.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
