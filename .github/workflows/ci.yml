name: CI

on:
  push:
    branches: [main]
  pull_request:

# Một lượt mới của cùng nhánh hủy lượt cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Chỉ đọc mã. Không có bí mật nào trong workflow này.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NotesApi.slnx

      - name: Build
        run: dotnet build NotesApi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NotesApi.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
